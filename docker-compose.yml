services:
  backend:
    build:
      context: ./backend
      network: host
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,0.0.0.0
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  frontend:
    build:
      context: .
      network: host
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  backend_media:
  backend_static:
