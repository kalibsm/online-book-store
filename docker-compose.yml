services:
  backend:
    build:
      context: ./backend
      network: host
    network_mode: host
    env_file:
      - path: ./backend/.env.local
        required: false
    environment:
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,nginx,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles

  frontend:
    build:
      context: .
      network: host
    network_mode: host
    env_file:
      - path: .env.local
        required: false
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - backend_static:/staticfiles
      - backend_media:/media
    depends_on:
      - frontend
      - backend

volumes:
  backend_media:
  backend_static:
